name: Refresh animated profile
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/render_profile.py
      - .github/workflows/refresh-profile.yml
permissions:
  contents: write
concurrency:
  group: animated-profile-refresh
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Render verified public GitHub data
        run: python3 scripts/render_profile.py
      - name: Commit refreshed artwork
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/animated-profile.svg assets/profile-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh animated profile with public GitHub activity'
          git push origin HEAD:main
