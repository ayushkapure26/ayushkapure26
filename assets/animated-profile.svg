<rect x="28" y="321" width="458" height="173" rx="12" class="card"/><text x="52" y="355" class="label">01 / WHAT I BUILD</text><text x="52" y="391" class="title">Tools with a purpose.</text><text x="52" y="423" class="body muted">Fuel tracking, clear reports and offline flows.</text><text x="52" y="456" class="small" fill="#b596ff">CNG MITRA  →  ANDROID + WEB EXPLORATION</text>
<rect x="504" y="321" width="468" height="173" rx="12" class="card"/><text x="529" y="355" class="label">02 / CURRENTLY EXPLORING</text><text x="529" y="393" class="title">A little better, every build.</text><text x="529" y="427" class="body muted">Offline usability · Testing · Data presentation</text><rect x="529" y="451" width="408" height="5" rx="2" fill="#293354"/><rect x="529" y="451" width="128" height="5" rx="2" fill="url(#accent)"><animate attributeName="width" values="90;408;90" dur="9s" repeatCount="indefinite"/></rect>
<rect x="28" y="512" width="944" height="252" rx="12" class="card"/><text x="52" y="547" class="label">03 / THE TOOLKIT</text>
