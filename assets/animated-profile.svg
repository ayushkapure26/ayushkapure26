<text x="391" y="596" class="title">From interface to storage.</text><text x="391" y="629" class="body muted">Kotlin · Compose · Room · Coroutines</text><text x="391" y="660" class="body muted">Git · GitHub Actions · Android testing</text><text x="391" y="707" class="small muted">PROJECT INTEGRATIONS</text><text x="391" y="733" class="body">Firebase / Google Maps / Gemini</text>
